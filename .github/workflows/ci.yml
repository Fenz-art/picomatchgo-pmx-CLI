name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install golangci-lint
        run: GOTOOLCHAIN=go1.22.12 go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.60.3

      - name: Format check
        run: gofmt -w $(find . -name '*.go' -not -path './.git/*') && git diff --exit-code

      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...

      - name: Vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run fuzz targets
        run: |
          go test -fuzz=FuzzScan -fuzztime=15s .
          go test -fuzz=FuzzParse -fuzztime=15s .
          go test -fuzz=FuzzIsMatch -fuzztime=15s .

      - name: Run benchmarks
        run: go test -bench=. -run=^$ ./...
